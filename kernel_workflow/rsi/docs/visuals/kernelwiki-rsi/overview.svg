            <text x="32" y="624" class="small" font-size="11">数值取自归档 node039/dsa-sparse-mla；A1 → A2 连线、调度顺序与 B0 对照为教学构造。真实 primary worlds = 0；本图不调用模型 / GPU，不晋级或发布 Knowledge。</text>
