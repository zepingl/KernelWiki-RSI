                <g class="step reached" data-step="1"><circle class="step-dot" cx="672" cy="197" r="5"/><text x="688" y="201">源码 / 父上下文</text></g>
                <g class="step reached" data-step="2"><circle class="step-dot" cx="672" cy="226" r="5"/><text x="688" y="230">原始调用 / 计划</text></g>
                <g class="step reached" data-step="3"><circle class="step-dot" cx="672" cy="255" r="5"/><text x="688" y="259">知识版本 / 正文</text></g>
