              <text x="882" y="182" class="tag">INVARIANTS</text>
              <g font-size="12"><text x="882" y="210">原始事实不改写</text><text x="882" y="236">analyst 判断独立记录</text><text x="882" y="262">搜索不到 ≠ 证明不存在</text></g>
            </g>

            <!-- 03 freeze buffer -->
            <g class="station s2">
              <rect class="card" x="820" y="372" width="288" height="220" rx="16" filter="url(#lift)"/>
              <circle class="badge" cx="844" cy="398" r="12"/><text class="badge-n" x="844" y="402">03</text>
              <text x="864" y="403" class="h">冻结 Buffer</text>
              <text x="1088" y="402" text-anchor="end" class="tag">FREEZE</text>
              <text x="844" y="432" class="small">每轮只冻结一次，之后只读</text>
              <rect x="842" y="448" width="244" height="44" rx="10" fill="#eef4fd" stroke="#c9dbf7"/>
              <text x="860" y="476" class="mono env" font-size="15">T₁</text><text x="896" y="475" font-size="12">构造世界 01</text>
              <g class="world-next"><rect x="842" y="500" width="244" height="44" rx="10" fill="#eef4fd" stroke="#c9dbf7"/>
                <text x="860" y="528" class="mono env" font-size="15">T₂</text><text x="896" y="527" font-size="12">构造世界 02 · 第二轮加入</text></g>
              <text x="844" y="572" class="small mono" font-size="10.5">attempts · worlds · reverse.jsonl</text>
            </g>

            <!-- 04 dream in replay -->
            <g class="station s3">
              <rect class="card" x="298" y="372" width="478" height="220" rx="16" filter="url(#lift)"/>
              <circle class="badge" cx="322" cy="398" r="12"/><text class="badge-n" x="322" y="402">04</text>
              <text x="342" y="403" class="h">梦境回放</text>
              <text x="756" y="402" text-anchor="end" class="tag mid">0 次 KERNEL 执行</text>
              <text x="322" y="432" class="small">Developer → Reviewer → replay · Objective = Q − 0.01 × C</text>
              <g class="trial" data-trial-card="neutral">
                <rect class="trial-card" x="318" y="446" width="140" height="78" rx="11"/>
                <text x="332" y="470" class="mono" font-size="15">θ₀</text><text x="444" y="469" text-anchor="end" class="tag">BASE</text>
                <text x="332" y="490" font-size="12">基线轮转</text>
                <text id="score-neutral" x="332" y="513" class="mono" font-size="14">−0.00923</text>
                <title>A1 → 新根分支 B0</title>
              </g>
              <g class="trial" data-trial-card="stop">
                <rect class="trial-card" x="468" y="446" width="140" height="78" rx="11"/>
                <text x="482" y="470" class="mono" font-size="15">θ₁</text><text x="594" y="469" text-anchor="end" class="tag">TRY</text>
                <text x="482" y="490" font-size="12">过早停止</text>
                <text id="score-stop" x="482" y="513" class="mono" font-size="14">+0.00077</text>
                <title>减少成本，但错过增益</title>
