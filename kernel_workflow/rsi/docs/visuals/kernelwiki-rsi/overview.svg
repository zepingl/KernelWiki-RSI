<svg id="scene" class="scene-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 640" role="img" aria-labelledby="scene-title scene-description" data-phase="4" data-round="1" data-trial="continue" data-focus="false" data-playing="false" width="1140" height="640">
            <title id="scene-title">KernelWiki-RSI 一轮外循环：在线探索、逆向追溯、冻结 buffer、梦境回放、择优反馈</title>
            <desc id="scene-description">顺时针闭环。上方与右侧是真实历史（蓝），下方是梦境回放（紫）。教学构造的 discovery tree：A1 与 A2 的分数来自两条真实历史兄弟分支，A1 → A2 延续是构造的；B0 复用 root 对照。现有 Python replay 计算基线与续探策略的同预算差异。当前真实 buffer 的 primary worlds 为零，没有真实自进化晋级。</desc>
            <defs>
              <filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f141e" flood-opacity=".06"/></filter>
              <marker id="head-line" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#c3c8d0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
              <marker id="head-env" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#3273dc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
              <marker id="head-mid" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 L6 4 L1 7" fill="none" stroke="#7a52c7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
              <style>
                .scene-root{font-family:"Noto Sans SC","Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
                .scene-root text{fill:#24292f}
                .scene-root .mono{font-family:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace}
                .scene-root .h{font-size:16px;font-weight:600}
                .scene-root .tag{font-family:"JetBrains Mono","DejaVu Sans Mono",ui-monospace,monospace;font-size:10.5px;letter-spacing:1.2px;fill:#6a7079}
                .scene-root .small{font-size:12px;fill:#6a7079}
                .scene-root .env{fill:#2456b0}.scene-root .mid{fill:#5e3aa8}.scene-root .warm{fill:#9a5d17}
                .scene-root .card{fill:#fff;stroke:#e9eaee;stroke-width:1.2;transition:stroke .35s,fill .35s}
                .scene-root .badge{fill:#f1f2f4;transition:fill .35s}
                .scene-root .badge-n{font-family:"JetBrains Mono","DejaVu Sans Mono",monospace;font-size:10.5px;font-weight:600;text-anchor:middle;fill:#6a7079}
                .scene-root .station,.scene-root .edge-label{transition:opacity .45s}
                .scene-root[data-focus="true"] .station{opacity:.38}
                .scene-root[data-focus="true"][data-phase="0"] .s0,.scene-root[data-focus="true"][data-phase="0"] .tree,
                .scene-root[data-focus="true"][data-phase="1"] .s1,.scene-root[data-focus="true"][data-phase="1"] .tree,
                .scene-root[data-focus="true"][data-phase="2"] .s2,
                .scene-root[data-focus="true"][data-phase="3"] .s3,.scene-root[data-focus="true"][data-phase="3"] .tree,
                .scene-root[data-focus="true"][data-phase="4"] .s4{opacity:1}
                .scene-root[data-phase="0"] .s0 .card,.scene-root[data-phase="1"] .s1 .card,.scene-root[data-phase="2"] .s2 .card{stroke:#3273dc;stroke-width:1.8;fill:#fbfcff}
                .scene-root[data-phase="3"] .s3 .card,.scene-root[data-phase="4"] .s4 .card{stroke:#7a52c7;stroke-width:1.8;fill:#fdfbff}
                .scene-root[data-phase="0"] .s0 .badge,.scene-root[data-phase="1"] .s1 .badge,.scene-root[data-phase="2"] .s2 .badge{fill:#3273dc}
                .scene-root[data-phase="3"] .s3 .badge,.scene-root[data-phase="4"] .s4 .badge{fill:#7a52c7}
                .scene-root[data-phase="0"] .s0 .badge-n,.scene-root[data-phase="1"] .s1 .badge-n,.scene-root[data-phase="2"] .s2 .badge-n,
                .scene-root[data-phase="3"] .s3 .badge-n,.scene-root[data-phase="4"] .s4 .badge-n{fill:#fff}
                .scene-root .edge{fill:none;stroke:#c3c8d0;stroke-width:1.6;stroke-linecap:round;transition:stroke .35s}
                .scene-root[data-phase="0"] .e0,.scene-root[data-phase="1"] .e1{stroke:#3273dc;stroke-width:2.2}
                .scene-root[data-phase="2"] .e2,.scene-root[data-phase="3"] .e3,.scene-root[data-phase="4"] .e4{stroke:#7a52c7;stroke-width:2.2}
                .scene-root[data-playing="true"][data-phase="0"] .e0,.scene-root[data-playing="true"][data-phase="1"] .e1,.scene-root[data-playing="true"][data-phase="2"] .e2,
                .scene-root[data-playing="true"][data-phase="3"] .e3,.scene-root[data-playing="true"][data-phase="4"] .e4{stroke-dasharray:5 6;animation:flow 1.2s linear infinite}
                .scene-root[data-focus="true"] .edge-label{opacity:.4}
                .scene-root[data-focus="true"][data-phase="2"] .l2,.scene-root[data-focus="true"][data-phase="4"] .l4{opacity:1}
                .scene-root #token{opacity:0;transition:opacity .25s}
                .scene-root .tree-edge{stroke:#d7dae0;stroke-width:2;fill:none;stroke-linecap:round}
                .scene-root .construct{stroke:#d29b55;stroke-dasharray:4 5}
                .scene-root .route{fill:none;stroke:#7a52c7;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:opacity .4s}
                .scene-root[data-phase="3"][data-trial="neutral"] .route.baseline,.scene-root[data-phase="3"][data-trial="stop"] .route.stop,.scene-root[data-phase="3"][data-trial="continue"] .route.learned,.scene-root[data-phase="4"] .route.learned{opacity:.22}
                .scene-root .node{cursor:pointer}
                .scene-root .node-ring{fill:#fff;stroke:#d7dae0;stroke-width:1.6;transition:fill .35s,stroke .35s}
                .scene-root .node-id{font-size:11px;font-weight:700;text-anchor:middle;fill:#6a7079}
                .scene-root .node.revealed .node-ring{fill:#eef4fd;stroke:#3273dc;stroke-width:2}
                .scene-root .node.revealed .node-id{fill:#2456b0}
                .scene-root .node:focus{outline:none}.scene-root .node:focus .node-ring{stroke:#7a52c7;stroke-width:3}
                .scene-root .node-score{opacity:.25;transition:opacity .35s}.scene-root .node-score.revealed{opacity:1}
                .scene-root .step-dot{fill:#fff;stroke:#c3c8d0;stroke-width:1.5;transition:fill .3s,stroke .3s}
                .scene-root .step.reached .step-dot{fill:#3273dc;stroke:#3273dc}
                .scene-root .step text{fill:#6a7079;transition:fill .3s}.scene-root .step.reached text{fill:#24292f}
                .scene-root .trial-card{fill:#fff;stroke:#e9eaee;stroke-width:1.2;transition:stroke .3s,fill .3s}
                .scene-root .trial.active .trial-card{fill:#f6f2fd;stroke:#7a52c7;stroke-width:1.8}
                .scene-root .world-next{opacity:.32;transition:opacity .4s}.scene-root[data-round="2"] .world-next{opacity:1}
                @keyframes flow{to{stroke-dashoffset:-22}}
                @media(prefers-reduced-motion:reduce){.scene-root *{animation:none!important;transition:none!important}}
              </style>
            </defs>

            <rect width="1140" height="640" fill="#fff"/>
            <text x="32" y="46" font-size="17" font-weight="700">KernelWiki-RSI</text>
            <text x="172" y="46" class="small">一轮外循环 · Knowledge 即探索策略，历史即梦境世界</text>
            <g class="small" font-size="11">
              <circle cx="760" cy="42" r="4.5" fill="#3273dc"/><text x="771" y="46">历史 · 实测数值</text>
              <circle cx="884" cy="42" r="4.5" fill="#7a52c7"/><text x="895" y="46">梦境 · 0 次执行</text>
              <path d="M1006 42h20" stroke="#d29b55" stroke-width="2" stroke-dasharray="4 4"/><text x="1033" y="46">教学构造</text>
            </g>

            <!-- the loop runs clockwise: 01 → 02 → 03 → 04 → 05 → 01 -->
            <path id="edge-0" class="edge e0" d="M596 201 H636" marker-end="url(#head-env)"/>
            <path id="edge-1" class="edge e1" d="M964 322 V368" marker-end="url(#head-env)"/>
            <path id="edge-2" class="edge e2" d="M818 483 H780" marker-end="url(#head-mid)"/>
            <path id="edge-3" class="edge e3" d="M296 483 H262" marker-end="url(#head-mid)"/>
            <path id="edge-4" class="edge e4" d="M142 370 V326" marker-end="url(#head-mid)"/>
            <text class="edge-label l2 small mid" x="976" y="350">历史成为 simulator</text>
            <text class="edge-label l4 small mid" x="154" y="352">θ 控制下一轮</text>

            <!-- 01 online explore -->
            <g class="station s0">
              <rect class="card" x="32" y="84" width="562" height="236" rx="16" filter="url(#lift)"/>
              <circle class="badge" cx="56" cy="110" r="12"/><text class="badge-n" x="56" y="114">01</text>
              <text x="76" y="115" class="h">在线探索</text>
              <text x="574" y="114" text-anchor="end" class="tag">ONLINE EXPLORE</text>
              <g transform="translate(96 140)">
                <path d="M32 0 V9 M29 -3h6" fill="none" stroke="#9dbdf0" stroke-width="2.5" stroke-linecap="round"/>
                <rect x="0" y="9" width="64" height="44" rx="14" fill="#eef4fd" stroke="#9dbdf0" stroke-width="1.6"/>
                <path d="M-4 22h4v17h-4 M64 22h4v17h-4" fill="#dde9fb" stroke="#9dbdf0" stroke-width="1.2"/>
                <rect x="12" y="18" width="40" height="23" rx="8" fill="#2456b0"/>
                <circle cx="24" cy="29" r="3.2" fill="#cfe0ff"/><circle cx="40" cy="29" r="3.2" fill="#cfe0ff"/>
                <path d="M28 36h8" stroke="#9dbdf0" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M13 54v5 M51 54v5" stroke="#9dbdf0" stroke-width="4" stroke-linecap="round"/>
              </g>
              <text x="128" y="230" text-anchor="middle" font-size="14" font-weight="600">固定 GEAK Agent</text>
              <text x="128" y="249" text-anchor="middle" class="small">只读已揭示的 prefix</text>
              <rect x="54" y="266" width="148" height="34" rx="9" fill="#eef4fd"/>
              <text id="working-policy" x="128" y="288" text-anchor="middle" font-size="12.5" class="env">θ₂ · 续探已测优叶</text>
              <path class="tree-edge" d="M214 186 H282" marker-end="url(#head-line)"/>
              <text id="tree-title" x="300" y="302" class="tag">DISCOVERY TREE · 构造世界 T₁</text>
            </g>
            <g class="station tree">
              <path class="tree-edge" d="M334 176 L401 152 M334 196 L401 232"/>
              <path class="tree-edge construct" d="M444 146 H502"/>
              <path class="route baseline" d="M316 186 L422 146 M316 186 L422 240"/>
              <path class="route stop" d="M316 186 L422 146"/>
              <path class="route learned" d="M316 186 L422 146 H524"/>
              <g class="node revealed" data-node="root" aria-label="查看 root 证据">
                <circle class="node-ring" cx="316" cy="186" r="21"/><text class="node-id" x="316" y="190">root</text>
                <title>原始 root 分数，作为归一化基准。</title>
              </g>
              <text x="316" y="226" text-anchor="middle" class="small">q = 0</text>
              <g class="node revealed" data-node="A1" aria-label="查看 A1 分数出处">
                <circle class="node-ring" cx="422" cy="146" r="19"/><text class="node-id" x="422" y="150">A1</text>
                <title>复用原始弱分支分数；图中的节点和调度顺序为构造。</title>
              </g>
              <text id="node-a1-quality" class="node-score revealed" data-score-node="A1" x="422" y="188" text-anchor="middle" font-size="14" font-weight="600">+1.08%</text>
              <g class="node revealed" data-node="A2" aria-label="查看 A2 分数出处与构造连线">
                <circle class="node-ring" cx="524" cy="146" r="21"/><text class="node-id" x="524" y="150">A2</text>
                <title>A2 原本也是 root 的子分支。A1 → A2 是教学构造，不是逆向推断的历史 continuation。</title>
              </g>
              <text id="node-a2-quality" class="node-score env revealed" data-score-node="A2" x="524" y="192" text-anchor="middle" font-size="18" font-weight="700">+7.78%</text>
              <g class="node" data-node="B0" aria-label="查看 B0 对照说明">
                <circle class="node-ring" cx="422" cy="240" r="19"/><text class="node-id" x="422" y="244">B0</text>
                <title>B0 是 root 测量的复用对照，不是额外观察到的 kernel attempt。</title>
              </g>
              <text class="node-score" data-score-node="B0" x="452" y="237" font-size="13" font-weight="600">0.00%</text>
              <text class="node-score small" data-score-node="B0" x="452" y="254">复用 root 对照</text>
            </g>

            <!-- 02 reverse trace -->
