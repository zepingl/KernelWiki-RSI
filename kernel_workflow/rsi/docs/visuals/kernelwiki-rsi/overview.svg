              <text x="320" y="552" class="mono small">θ₀</text>
              <rect x="344" y="545" width="180" height="7" rx="3.5" fill="#f1f2f4"/><rect id="baseline-bar" x="344" y="545" width="19.387953230535214" height="7" rx="3.5" fill="#c3c8d0"/>
